Name = CRT Retro Filter
Author = J2ME-Loader LiveEditor

Vertex   = crt.vsh
Fragment = crt.fsh

# ---- Output / Upscaling ---------------------------------------------------
# OutputResolution = false  → shader works in display resolution (correct for post-FX)
# Upscaling        = false  → we don't upscale; we post-process the game's own FBO
OutputResolution = false
Upscaling        = false

# ---- Adjustable Parameters (u_setting.xyzw) --------------------------------
# Each Setting maps to one component of the vec4 uniform u_setting:
#   Setting 1 → u_setting.x  (scanline strength)
#   Setting 2 → u_setting.y  (curvature / barrel distortion)
#   Setting 3 → u_setting.z  (phosphor mask / shadow mask)
#   Setting 4 → u_setting.w  (bloom / glow strength)

SettingName1         = Scanline Intensity
SettingDefaultValue1 = 0.55
SettingMinValue1     = 0.0
SettingMaxValue1     = 1.0
SettingStep1         = 0.05

SettingName2         = Screen Curvature
SettingDefaultValue2 = 0.06
SettingMinValue2     = 0.0
SettingMaxValue2     = 0.14
SettingStep2         = 0.01

SettingName3         = Phosphor Mask
SettingDefaultValue3 = 0.35
SettingMinValue3     = 0.0
SettingMaxValue3     = 1.0
SettingStep3         = 0.05

SettingName4         = Bloom / Glow
SettingDefaultValue4 = 0.20
SettingMinValue4     = 0.0
SettingMaxValue4     = 1.0
SettingStep4         = 0.05
