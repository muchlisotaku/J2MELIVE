name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # tombol "Run workflow" manual di GitHub Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17 (wajib untuk AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Setup NDK versi yang dipakai proyek
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 22.1.7171670
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;22.1.7171670" \
            "cmake;3.22.1" || true

      # 4. Kasih permission ke gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Cache Gradle dependencies (supaya build lebih cepat berikutnya)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Build APK debug flavor "open" (tidak butuh keystore)
      - name: Build openDebug APK
        run: ./gradlew assembleOpenDebug --stacktrace

      # 7. Upload APK sebagai artifact (bisa di-download dari Actions tab)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Loader-LiveEditor-debug
          path: app/build/outputs/apk/open/debug/*.apk
          retention-days: 7

      # 8. (Opsional) Tampilkan info APK yang dihasilkan
      - name: Show APK info
        run: |
          echo "=== APK yang dihasilkan ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
